[package]
name = "committy"
version = "1.9.1"
authors = ["Arnaud (Martient) Leherpeur <arnaud.leherpeur@taultek.com>"]
edition = "2021"
description = "🚀 Generate clear, concise, and structured commit messages effortlessly"
repository = "https://github.com/martient/committy"
license-file = "LICENSE"
include = ["/src", "LICENSE"]


[dependencies]
structopt = "0.3.26"
inquire = "0.9.1"
git2 = { version = "0.20.2", features = ["vendored-openssl"] }
thiserror = "2.0.17"
anyhow = "1.0.100"
sentry = "0.46.0"
chrono = { version = "0.4.42", features = ["serde"] }
semver = "1.0.27"
regex = "1.12.2"
log = "0.4.29"
env_logger = "0.11.6"
strsim = "0.11.1"
self_update = { version = "0.42.0", features = [
    "archive-tar",
    "compression-flate2",
    "archive-zip",
] }
colored = "3.0.0"
indicatif = "0.18.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
toml = "0.9.8"
toml_edit = "0.23.7"
glob = "0.3"
dirs = "6.0.0"
reqwest = { version = "0.12.24", features = ["json", "blocking"] }
tokio = { version = "1.48.0", features = ["full"] }
once_cell = "1.21.3"
uuid = {version = "1.19.0", features = ["v4"]}
async-trait = "0.1.83"
minijinja = "2.12.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
mockall = "0.13.1"
serial_test = "3.2.0"
