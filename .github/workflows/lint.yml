name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:
    # `**` rather than `*`: in Actions branch filters `*` does not match `/`,
    # so a pull request targeting any branch with a slash in its name -- every
    # stacked pull request, and anything under a `feat/` or `fix/` prefix --
    # ran no checks at all.
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: actions-rs/toolchain@v1.0.7
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint with clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test -- --test-threads=1
      - name: Smoke test lint-message CLI
        run: |
          cargo run -- --non-interactive lint-message --message "feat: CI smoke test for lint-message"
